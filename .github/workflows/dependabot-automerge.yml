# Auto-approve + enable auto-merge only for Dependabot / GitHub-bot dependency PRs.
# Outside contributors (and any human PR) are not touched — the main-branch ruleset
# still requires at least one approving review before those can merge.
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    # Only GitHub-initiated bot PRs — never human / fork contributors.
    if: >
      github.event.pull_request.draft == false &&
      (
        github.event.pull_request.user.login == 'dependabot[bot]' ||
        (
          github.actor == 'dependabot[bot]' &&
          startsWith(github.head_ref, 'dependabot/')
        )
      )
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Only auto-merge patch bumps
        id: bump
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if python3 scripts/is_patch_bump.py "$PR_TITLE"; then
            echo "patch=true" >> "$GITHUB_OUTPUT"
            echo "Patch bump — will test and merge."
          else
            echo "patch=false" >> "$GITHUB_OUTPUT"
            echo "Not a patch ($PR_TITLE) — leaving PR for review."
          fi

      - name: Install dependencies
        if: steps.bump.outputs.patch == 'true'
        run: pip install -r requirements.txt pytest
      - name: Run tests
        if: steps.bump.outputs.patch == 'true'
        run: python -m pytest fathom/tests/ -q

      - name: Approve Dependabot PR
        if: steps.bump.outputs.patch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL"

      - name: Squash-merge
        if: steps.bump.outputs.patch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"
