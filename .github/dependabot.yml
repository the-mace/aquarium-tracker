# Dependabot version updates for pip + GitHub Actions.
# Auto-merge after CI: patch bumps, and minor bumps unless the current version is 0.x.
# Majors and unparseable/grouped titles stay open for review (see dependabot-automerge.yml).
# Outside-contributor PRs still require an approving review (repo ruleset on main).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
